[project]
name = "portal-shooter"
version = "0.1.0"
description = "pygame portal shooter playground"
requires-python = ">=3.9"
dependencies = [
    "pygame-ce>=2.5.6",
    "pyglm>=2.8.3",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "autopep8",
    "mypy>=1.19.1",
    "pylint",
    "ruff>=0.15.4",
    "snakeviz",
    "ty>=0.0.19",
    "types-tqdm>=4.67.3.20260205",
]
